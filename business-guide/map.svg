<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="map-title map-desc">
<title id="map-title">UWANT美洲业务资料查找图</title>
<desc id="map-desc">从市场机会、竞品选择、自身定位、经营表现、库存利润和数据可信度六个业务问题出发，分别列明要查什么、看板位置和原始资料来源。此图独立于网站目录。</desc>
<style>text{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif} .body{font-size:16px;fill:#193e31} .leaf-title{font-size:18px;font-weight:600;fill:#193e31} .where{fill:#176a50} .branch{font-size:20px;font-weight:600;fill:#176a50} .line{fill:none;stroke:#b8cfc2;stroke-width:1.6;stroke-linecap:round}</style>
<rect width="1200" height="1000" fill="#fff"/>
<text x="600" y="36" text-anchor="middle" font-size="28" font-weight="600" fill="#193e31">UWANT 美洲业务资料查找图</text>
<text x="600" y="65" text-anchor="middle" font-size="16" fill="#60766b">从业务问题出发，找到要看的资料和来源</text>

