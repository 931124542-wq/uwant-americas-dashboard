<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src https://http2.mlstatic.com https://m.media-amazon.com https://images-na.ssl-images-amazon.com; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>月度市场数据 · UWANT</title>
<link rel="stylesheet" href="history.css?v=83acdecbf466">
<link rel="stylesheet" href="../rank-photos.css?v=c46d26f58f42">
<script src="public-history.js?v=e5d8bf1e031b" defer></script>
<script src="../rank-photos.js?v=12dd6a2ece34" defer></script>
<script src="product-photos.js?v=81b982a43be9" defer></script>

<script src="../model.js?v=8686a5102e4b" defer></script>

</head>
<body>
<header><a href="https://931124542-wq.github.io/uwant-americas-dashboard/">UWANT · 美洲市场</a><a id="market-overview" href="https://931124542-wq.github.io/uwant-americas-dashboard/">市场总览</a></header>
<main>
<h1>月度市场数据</h1>
<form method="get" id="scope" class="filters">
  <label>平台<select name="platform" id="platform"><option value="ml">Mercado Libre</option><option value="amazon">Amazon</option></select></label>
  <label>国家<select name="country" id="country"></select></label>
  <label id="category-field">品类<select name="category" id="category"></select></label>
  <label>起始月<input name="startMonth" id="startMonth" type="month" required></label>
  <label>结束月<input name="endMonth" id="endMonth" type="month" required></label>
  <button>应用</button>
</form>
<div class="basis" id="basis-field" hidden><label>统计范围<select id="basis"><option value="sample">同类商品样本</option><option value="category">大麦平台类目</option></select></label></div>
<div id="report" aria-live="polite"></div>
<details class="load" id="local-data">
  <summary>本机月度数据</summary>
  <div class="load-actions">
    <label class="button">打开文件<input type="file" id="archive-file" accept=".json,application/json"></label>
    <p id="file-status" role="status"></p>
  </div>
</details>
</main>
</body>
</html>
